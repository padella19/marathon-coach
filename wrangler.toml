name = "marathon-coach"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# La dashboard (cartella public) viene servita dallo stesso Worker
[assets]
directory = "./public"
binding = "ASSETS"

# Database chiave-valore (crealo con: npx wrangler kv namespace create KV)
[[kv_namespaces]]
binding = "KV"
id = "46ca1335f01a4b25ac142813bf69e1bc"

# Orari in UTC: ogni 15' nuove uscite · ogni giorno 04:30 trasferte · domenica 18:00 focus settimanale
[triggers]
crons = ["*/15 * * * *", "30 4 * * *", "0 18 * * SUN"]

[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"

# Secrets da impostare dal pannello Cloudflare (NON qui): vedi README
# obbligatori: DASH_TOKEN, INTERVALS_API_KEY
# opzionali: INTERVALS_ATHLETE_ID, ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# alternativa a intervals (richiede abbonamento Strava): STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_VERIFY_TOKEN
