name = "marathon-coach"
main = "src/index.js"
compatibility_date = "2026-10-01"

# La dashboard (cartella public) viene servita dallo stesso Worker
[assets]
directory = "./public"
binding = "ASSETS"

# Database chiave-valore (crealo con: npx wrangler kv namespace create KV)
[[kv_namespaces]]
binding = "KV"
id = "46ca1335f01a4b25ac142813bf69e1bc"

# Orari in UTC: ogni giorno 04:30 (05:30/06:30 in Italia) + domenica 18:00 focus settimanale
[triggers]
crons = ["30 4 * * *", "0 18 * * SUN"]

[vars]
CLAUDE_MODEL = "claude-sonnet-5-5"

# Secrets da impostare (NON qui): vedi README
# STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_VERIFY_TOKEN, DASH_TOKEN, ANTHROPIC_API_KEY
# opzionali: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
